# Releu de notificari: pornit de Worker-ul din Cloudflare, trimite mesajul prin ntfy.
name: notify
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Mesajul ntfy in format JSON (fara topic)
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PAYLOAD: ${{ inputs.payload }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          jq -c --arg t "$NTFY_TOPIC" --arg e "$ALERT_EMAIL" \
            '.topic = $t | if .email and $e != "" then .email = $e else del(.email) end' <<<"$PAYLOAD" |
          curl -fsS --retry 3 --max-time 20 -o /dev/null -H "Authorization: Bearer $NTFY_TOKEN" -d @- https://ntfy.sh/
