# Releu de notificari: pornit de Worker-ul din Cloudflare, trimite mesajul prin ntfy.
name: notify
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Mesajul ntfy in format JSON (fara topic)
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PAYLOAD: ${{ inputs.payload }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          send() {
            curl -sS --fail-with-body --retry 3 --max-time 20 -o resp.json -w 'ntfy HTTP %{http_code}\n' \
              -H "Authorization: Bearer $NTFY_TOKEN" -d "$1" https://ntfy.sh/
          }
          PUSH=$(jq -c --arg t "$NTFY_TOPIC" '.topic = $t | del(.email)' <<<"$PAYLOAD")
          if [ -n "$ALERT_EMAIL" ] && jq -e '.email' <<<"$PAYLOAD" >/dev/null; then
            # Un email respins de ntfy nu are voie sa blocheze notificarea push.
            send "$(jq -c --arg e "$ALERT_EMAIL" '.email = $e' <<<"$PUSH")" ||
              { cat resp.json; echo "Emailul a esuat; trimit doar push."; send "$PUSH"; }
          else
            send "$PUSH"
          fi
