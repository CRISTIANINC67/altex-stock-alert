# Releu de notificari: pornit de Worker-ul din Cloudflare, trimite mesajul prin ntfy.
name: notify
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Mesajul ntfy in format JSON (fara topic)
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PAYLOAD: ${{ inputs.payload }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          echo "ALERT_EMAIL: $([ -n "$ALERT_EMAIL" ] && echo "setat, ${#ALERT_EMAIL} caractere" || echo NESETAT)"
          jq -c --arg t "$NTFY_TOPIC" --arg e "$ALERT_EMAIL" \
            '.topic = $t | if .email and $e != "" then .email = $e else del(.email) end' <<<"$PAYLOAD" |
          curl -sS --fail-with-body --retry 3 --max-time 20 -o resp.json -w 'ntfy HTTP %{http_code}\n' \
            -H "Authorization: Bearer $NTFY_TOKEN" -d @- https://ntfy.sh/ || { cat resp.json; exit 1; }
          jq -c 'del(.topic) | keys' resp.json
