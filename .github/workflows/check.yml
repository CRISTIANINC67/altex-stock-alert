# Varianta de rezerva. Se foloseste DOAR daca Altex blocheaza Cloudflare.
name: altex-stock-check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: Trimite o alerta de test
        type: boolean
        default: false

concurrency: altex-stock-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - id: check
        run: node src/gha.js
        env:
          PRODUCT_URL: "https://altex.ro/telefon-apple-iphone-16-pro-max-5g-512gb-desert-titanium/cpd/SMTIP16PM5DT/"
          ALERT_TITLE: "🚨 iPhone 16 Pro Max 512GB E ÎN STOC LA ALTEX!"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FORCE_ALERT: ${{ inputs.force_alert }}
      - if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
